name: train
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - btop  # System monitor (conda-forge) — for inspecting the renamed trainer process
  - pip:
    - pyyaml
    - psutil  # For RAM detection in dataset caching
    - pytest  # For running tests
    - setproctitle  # Renames the trainer process for htop/btop visibility (PROCESS_TITLE env)
    # PyTorch with ROCm is installed separately via setup_conda_server.sh
