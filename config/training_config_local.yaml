# =============================================================================
# Local Training Configuration (RTX 5050, 8GB VRAM, 12 cores, 32GB RAM)
# =============================================================================
# Updated 2026-04-04 based on training analysis (Parts 1-3).
# Key fixes: data starvation, P1/P2 asymmetry, testing enabled.
#
# Usage:
#   python -m dama.ai.ml.trainer --config config/training_config_local.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# Device Settings
# -----------------------------------------------------------------------------
device:
  type: "cuda"
  amp:
    enabled: true
    dtype: "float16"                    # float16 + GradScaler for RTX 5050 (no native bfloat16)
  compile:
    enabled: true                       # Auto-falls back to eager on failure
    mode: "reduce-overhead"             # CUDAGraphs — avoid "max-autotune" (Triton fails on RTX 5050)
  matmul_precision: "medium"            # TF32 enabled

# -----------------------------------------------------------------------------
# Model Architecture
# -----------------------------------------------------------------------------
# Must match existing checkpoints (128/8/256/128). DO NOT change without
# retraining from scratch or the checkpoint will fail to load.
# -----------------------------------------------------------------------------
model:
  channels: 128                         # CNN channels in ResidualBlocks
  num_blocks: 8                         # Number of residual blocks
  embedding_size: 256                   # Board embedding vector size
  hidden_size: 128                      # MoveScorer MLP hidden layer size

# -----------------------------------------------------------------------------
# Self-Play Settings
# -----------------------------------------------------------------------------
selfplay:
  cpu_workers: 11                       # 11 of 12 cores = 92%. GPU training barely uses CPU
                                        # (compiled fwd+loss, GPU-resident data). 1 core suffices
                                        # for GPU driver + training thread.
  games_per_epoch: 200                  # Was 20. Generates ~10,800 entries/epoch at avg 54 moves/game.
  difficulties:
    - "easy"
    - "medium"
    # - "hard"                          # Re-enable when model beats medium at >40% WR consistently
  focus_side: "both"                    # Was "black" (overcorrection). Balanced P1/P2 exposure.
  opponent_focus: "both"                # Was "algorithm". Now 50% ML-vs-ML + 50% ML-vs-algo.
  noise_prob: 0.15                      # Was 0.20. Slightly less noise for better convergence.
  max_moves_per_game: 150               # Was 100. Allow endgame play.
  pipeline_mode: "simultaneous"

  algo_vs_algo:
    enabled: true
    games_per_epoch: 400                # Cython fast path makes these cheap. Fills buffer quickly
                                        # so GPU has diverse batches from the start.
    difficulties:
      - "easy"
      - "medium"
      - "hard"

# -----------------------------------------------------------------------------
# Training Hyperparameters
# -----------------------------------------------------------------------------
training:
  batch_size: 8192                      # Saturate RTX 5050 compute units. Model is tiny (~500K params),
                                        # small batches leave GPU idle between kernel launches.
                                        # 8192 activations ~1.1GB, well within 8GB VRAM.
  learning_rate: 4.0e-4                 # Sqrt-scaled for batch 8192: base * sqrt(8192/2048) = 2× base.
  weight_decay: 1.0e-5
  grad_clip_norm: 1.0
  train_steps: 100000000000
  checkpoint_every: 2000
  gradient_accumulation_steps: 1

  lr_scheduler:
    enabled: true
    type: "cosine_warm_restarts"
    T_0: 2000                           # Was 500. Longer cycles at step 56K for plateau escape.
    T_mult: 2                           # Doubling: 2000, 4000, 8000, 16000, ...
    eta_min: 1.0e-5
    warmup_steps: 100                   # Was 150. Shorter warmup since base LR is lower.

  reward_mode: "cycle"                  # Was "scoring". Alternate scoring/uniform for diversity.

# -----------------------------------------------------------------------------
# DataLoader Settings
# -----------------------------------------------------------------------------
dataloader:
  num_workers: 0                        # FastBatchIterator bypasses DataLoader
  pin_memory: true
  prefetch_factor: 4
  replay_max_entries: 400000            # Large buffer → more batches per epoch → GPU stays busy.
                                        # 400K entries × ~3.5KB = ~1.4GB RAM (fine for 32GB).
  clear_replay_after_load: false        # Accumulate data across self-play cycles. With batch 8192
                                        # and ~10K entries per cycle, clearing gives only 1 batch/epoch.
                                        # Accumulating → ~48 batches/epoch when buffer fills (400K).

  ram_cache:
    enabled: true
    threshold_gb: 16.0                  # Was 24. Safer headroom on 32GB system.
    cache_file: null

# -----------------------------------------------------------------------------
# Model Testing Settings (ML vs Algorithm)
# -----------------------------------------------------------------------------
testing:
  enabled: true                         # Was false. MUST track training quality.
  every_n_steps: 2000                   # Was 5000. More frequent with smaller game count.
  num_games: 30                         # Was 50. 30 games = fast eval with directional signal.
  difficulty: "medium"

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
paths:
  checkpoint_dir: "models/checkpoints"
  latest_model: "models/latest.pt"
  replay_dir: "data/replay"
  log_dir: "logs"
  stats_file: "models/training_stats.json"

# -----------------------------------------------------------------------------
# Statistics Collection
# -----------------------------------------------------------------------------
statistics:
  enabled: true
  record_every: 2000                    # Each .item() forces CUDA sync (~20-100μs pipeline stall).
                                        # 2000 interval = 4× fewer GPU stalls vs 500.
  system_every: 5000
  model_health_every: 10000
  score_dist_every: 2000
  buffer_size: 50000
  flush_every: 5000
  output_dir: "logs/stats"

# -----------------------------------------------------------------------------
# Thermal Protection
# -----------------------------------------------------------------------------
thermal_protection:
  enabled: true
  temp_limit_c: 90
  rest_duration: "5m"
  check_every: 30

# -----------------------------------------------------------------------------
# Resume Settings
# -----------------------------------------------------------------------------
resume:
  enabled: true
  checkpoint_path: null
  skip_corrupted: true

# -----------------------------------------------------------------------------
# Time-based Stopping
# -----------------------------------------------------------------------------
time_limit:
  enabled: true
  duration: "4h"                        # Was 2h. Longer sessions for more progress.

# =============================================================================
# Hardware-Specific Profiles
# =============================================================================
# WARNING: Profiles do NOT override model architecture. Server uses 64/4/128/64
# which is INCOMPATIBLE with local checkpoints (128/8/256/128).
# =============================================================================

profiles:
  server:
    device:
      amp:
        dtype: "bfloat16"
      compile:
        mode: "max-autotune"
    selfplay:
      cpu_workers: 48
      games_per_epoch: 2048
    training:
      batch_size: 4096
      learning_rate: 3.0e-4
      lr_scheduler:
        warmup_steps: 400
    dataloader:
      replay_max_entries: 1000000
      ram_cache:
        threshold_gb: 64.0
    thermal_protection:
      enabled: false

  local:
    device:
      amp:
        dtype: "float16"
      compile:
        mode: "reduce-overhead"
    selfplay:
      cpu_workers: 11
      games_per_epoch: 200
    training:
      batch_size: 8192
      learning_rate: 4.0e-4

  cpu:
    device:
      type: "cpu"
      amp:
        enabled: false
    selfplay:
      cpu_workers: 4
      games_per_epoch: 50
    training:
      batch_size: 64
      learning_rate: 1.0e-4
    dataloader:
      num_workers: 2
      ram_cache:
        enabled: true
        threshold_gb: 8.0
