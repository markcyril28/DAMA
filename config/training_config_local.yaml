# =============================================================================
# Local Training Configuration (RTX 5050, 8GB VRAM, 12 cores, 32GB RAM)
# =============================================================================
# Updated 2026-04-05 based on optimization pass 66.
#
# Current state: model at step 2000, 0% WR vs medium/easy. All prior high-WR
# checkpoints (step 50K, 43% WR) were lost. Use auto-detect (checkpoint_path=null)
# or use training_config_local_retrain.yaml for fresh training.
#
# Key changes from previous config:
#   1. LR scheduler DISABLED — caused 43%->0% WR crash via 31x LR oscillations
#   2. LR set to 2.0e-4 — sqrt-scaled from 1.5e-4 for 2x batch size
#   3. opponent_focus changed to "algorithm" — at <50% WR, ML self-play teaches
#      losing patterns. 100% algorithmic teachers provide consistent signal.
#   4. games_per_epoch increased to 200 — more ML-vs-algo data per cycle
#   5. algo_vs_algo reduced to 900 — rebalances ratio (was 94.7% algo data)
#   6. focus_side "both" kept — board encoding correctly flips for P2
#      (move_encoder.py:30-35). Balanced exposure ensures both sides train equally.
#   7. testing every 1000 steps with 50 games — faster feedback loop
#   8. batch_size set to 8192 — doubled from 4096, better GPU warp occupancy
#
# Usage:
#   python -m dama.ai.ml.trainer --config config/training_config_local.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# Device Settings
# -----------------------------------------------------------------------------
device:
  type: "cuda"
  amp:
    enabled: true
    dtype: "float16"                    # float16 + GradScaler for RTX 5050 (no native bfloat16)
  compile:
    enabled: false                      # [Pass 20] Always fails on RTX 5050 ("device kernel image
                                        # is invalid"). Disabling avoids 5s warmup overhead.
  matmul_precision: "medium"            # TF32 enabled

# -----------------------------------------------------------------------------
# Model Architecture
# -----------------------------------------------------------------------------
# Must match existing checkpoints (128/8/256/128). DO NOT change without
# retraining from scratch or the checkpoint will fail to load.
# -----------------------------------------------------------------------------
model:
  channels: 128                         # CNN channels in ResidualBlocks
  num_blocks: 8                         # Number of residual blocks
  embedding_size: 256                   # Board embedding vector size
  hidden_size: 128                      # MoveScorer MLP hidden layer size

# -----------------------------------------------------------------------------
# Value Head (optional)
# -----------------------------------------------------------------------------
value_head:
  enabled: false                         # Not used in local training yet
  hidden_size: 128
  value_weight: 0.15                     # Matches server configs (default 0.5 is too high)

# -----------------------------------------------------------------------------
# Self-Play Settings
# -----------------------------------------------------------------------------
# Current model at 0% WR — 100% algorithmic opponents provide consistent
# learning signal. ML self-play at <50% WR produces mostly losing patterns.
# Re-enable ML self-play (opponent_focus: "both") once WR exceeds 30%.
# -----------------------------------------------------------------------------
selfplay:
  cpu_workers: 12                       # All 12 cores. GPU training uses torch.set_num_threads(1)
                                        # and the bg self-play coordinator is I/O-bound (waiting on
                                        # futures). OS scheduling handles the minimal time-slicing
                                        # needed for the training thread's rare CPU ops.
  games_per_epoch: 200                  # [Part 2] Doubled from 100. More ML-vs-algo data per cycle.
                                        # 200 games x ~42 moves = ~8.4K entries/cycle from ML games.
                                        # With algo-vs-algo, total ~57K entries/cycle.
  difficulties:
    - "easy"
    - "medium"
    # - "hard"                          # Re-enable when model beats medium at >40% WR consistently
    # - "super_hard"                    # Re-enable when model beats hard consistently
  focus_side: "both"                    # [Part 2] Balanced P1/P2 exposure. 100 games as P1, 100 as P2.
                                        # Board encoding correctly flips for P2 (move_encoder.py:30-35).
                                        # P1/P2 asymmetry was due to under-training, not encoding bugs.
  opponent_focus: "algorithm"           # [Part 1] 100% algorithmic opponents. Was "both" (50% ML
                                        # self-play). At <50% WR, ML-vs-ML generates mostly losing
                                        # games. Pure algo teachers give consistent learning signal.
  noise_prob: 0.15                      # Sweet spot — 85% teacher moves, 15% exploration
  max_moves_per_game: 150               # Allow endgame play (avg game length is ~42 moves,
                                        # so this rarely constrains games)
  pipeline_mode: "simultaneous"         # Was "alternate" — GPU sat idle during entire self-play
                                        # cycle (~60s+). Simultaneous trains on GPU while CPU
                                        # generates data in background. With batch_size=8192 and
                                        # ~57K entries, epochs are <1s, so GPU processes hundreds
                                        # of epochs while waiting for next self-play batch.

  algo_vs_algo:
    enabled: false                      # [Pass 61] Disabled — algo-vs-algo has 99.7% P1 win
                                        # rate, creating extreme bias in reward weighting.
                                        # Re-enable once model reaches >30% WR and can benefit
                                        # from diverse training data.
    games_per_epoch: 200                # [Pass 61] Reduced from 900. Synced with retrain config.
    difficulties:
      - "easy"
      - "medium"
      # - "hard"                        # [Pass 61] Removed — model at 0% WR

# -----------------------------------------------------------------------------
# Training Hyperparameters
# -----------------------------------------------------------------------------
training:
  batch_size: 16384                     # [Pass 68] Doubled from 8192. At 16384: ~2.4GB activations.
                                        # VRAM budget: model 72MB + dataset 0.93GB + pre-shuffle 0.93GB
                                        # + activations 2.4GB = ~4.3GB of 8GB (54%). Better GPU warp
                                        # occupancy. At 800K entries: 48 batches/epoch.
  learning_rate: 2.8e-4                 # [Pass 68] Sqrt-scaled from 2.0e-4 for 2x batch:
                                        #   lr_new = 2.0e-4 × sqrt(16384/8192) ≈ 2.83e-4, rounded 2.8e-4.
                                        # Still well below the 3.9e-4 that caused the crash.
  weight_decay: 1.0e-5                  # Model is underfitting — keep regularization minimal
  grad_clip_norm: 1.0                   # Standard clipping — stable with algo-only data
  train_steps: 100000000000             # Unlimited — time_limit controls stopping
  checkpoint_every: 2000                # Save every 2000 steps for safety
  gradient_accumulation_steps: 1

  # LR SCHEDULER: DISABLED
  # [Part 1] Root cause of catastrophic regression. Cosine warm restarts with
  # T_0=2000 created 31x LR swings (1.24e-5 -> 3.90e-4) that destroyed the
  # model's learned policy over steps 50K-56K. Fixed LR is stable and proven
  # (server v5 post-mortem reached the same conclusion independently).
  # Re-enable only after the model reaches a clear plateau (loss stable for
  # >5000 steps AND WR stable for >3 test cycles).
  lr_scheduler:
    enabled: false
    type: "cosine_warm_restarts"        # (Inactive — kept for reference)
    T_0: 5000                           # If re-enabled: much longer cycles to prevent instability
    T_mult: 2
    eta_min: 5.0e-5                     # Higher floor — don't let LR drop below useful range
    warmup_steps: 200

  reward_mode: "scoring"                # [Pass 61] Changed from "cycle". Consistent reward signal.
                                        # "cycle" amplifies P1 bias on scoring epochs (pass 56).

# -----------------------------------------------------------------------------
# DataLoader Settings
# -----------------------------------------------------------------------------
dataloader:
  num_workers: 0                        # FastBatchIterator bypasses DataLoader
  pin_memory: true
  prefetch_factor: 4                   # Unused — FastBatchIterator bypasses DataLoader
  replay_max_entries: 800000             # [Pass 68] Reduced from 1M for batch=16384 VRAM budget.
                                        # 800K × 1168 bytes (fp16) = ~0.93GB VRAM. Total with
                                        # activations (2.4GB) + pre-shuffle (0.93GB) = 4.3GB of 8GB.
  clear_replay_after_load: true          # [Pass 61] Prevents stale/degenerate data from
                                        # accumulating. Synced with retrain config.
  max_moves_per_sample: 32              # Max legal moves in Dama is ~20; 32 saves 50% vs old default of 64

  ram_cache:
    enabled: true
    threshold_gb: 16.0                  # Safe headroom on 32GB system
    cache_file: null

# -----------------------------------------------------------------------------
# Model Testing Settings (ML vs Algorithm)
# -----------------------------------------------------------------------------
# [Part 1] More frequent testing to catch regressions early.
# 50 games gives +/-14% CI (95% confidence) — enough for directional signal.
# At ~98 steps/epoch with alternate mode, test every ~10 epochs.
# -----------------------------------------------------------------------------
testing:
  enabled: true
  every_n_steps: 1000                   # [Part 1] Was 2000. Faster feedback to catch regressions.
  num_games: 50                         # [Part 1] Was 30. Slightly more reliable signal.
  difficulty: "easy"                    # [Pass 56] Changed from "medium". At 0% WR vs medium,
                                        # testing against medium gives no signal. Test easy first.

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
paths:
  checkpoint_dir: "models/checkpoints"
  latest_model: "models/latest.pt"
  replay_dir: "data/replay"
  log_dir: "logs"
  stats_file: "models/training_stats.json"

# -----------------------------------------------------------------------------
# Statistics Collection
# -----------------------------------------------------------------------------
statistics:
  enabled: true
  record_every: 1000                    # Balance between GPU sync stalls and monitoring granularity
  system_every: 5000
  model_health_every: 5000
  score_dist_every: 1000
  buffer_size: 50000
  flush_every: 500                      # [Pass 17 fix]: 5000 loses stats on short runs
  output_dir: "logs/stats"

# -----------------------------------------------------------------------------
# Thermal Protection
# -----------------------------------------------------------------------------
thermal_protection:
  enabled: true
  temp_limit_c: 90
  rest_duration: "5m"
  check_every: 30

# -----------------------------------------------------------------------------
# Resume Settings
# -----------------------------------------------------------------------------
resume:
  enabled: true
  checkpoint_path: null                  # [Pass 17 fix]: model_step_050000.pt no longer
                                        # exists. Set null for auto-detect, or provide
                                        # a valid path when a good checkpoint is available.
  skip_corrupted: true

# -----------------------------------------------------------------------------
# Time-based Stopping
# -----------------------------------------------------------------------------
time_limit:
  enabled: true
  duration: "4h"

# =============================================================================
# Hardware-Specific Profiles (reference only — use top-level values directly)
# =============================================================================
# WARNING: Profiles do NOT override model architecture. The base config in
# training_config.yaml uses 64/4/128/64 which is INCOMPATIBLE with local
# checkpoints (128/8/256/128). Always use this file for local training.
# =============================================================================

profiles:
  server:
    device:
      amp:
        dtype: "bfloat16"
      compile:
        mode: "max-autotune"
    selfplay:
      cpu_workers: 96                   # Synced with training_config_server.yaml
      games_per_epoch: 512              # Synced with training_config_server.yaml
    training:
      batch_size: 32768
      learning_rate: 2.0e-4
      lr_scheduler:
        enabled: false                  # LR scheduler disabled per v5 post-mortem
    dataloader:
      replay_max_entries: 5000000       # Synced with training_config_server.yaml
      ram_cache:
        threshold_gb: 64.0
    thermal_protection:
      enabled: false

  local:
    device:
      amp:
        dtype: "float16"
      compile:
        mode: "reduce-overhead"
    selfplay:
      cpu_workers: 11                   # Matches top-level
      games_per_epoch: 200              # [Part 3] Fixed: now matches top-level
    training:
      batch_size: 16384                 # [Pass 68] Matches top-level
      learning_rate: 2.8e-4             # [Pass 68] Matches top-level

  cpu:
    device:
      type: "cpu"
      amp:
        enabled: false
    selfplay:
      cpu_workers: 4
      games_per_epoch: 50
    training:
      batch_size: 64
      learning_rate: 1.0e-4
    dataloader:
      num_workers: 2
      ram_cache:
        enabled: true
        threshold_gb: 8.0
