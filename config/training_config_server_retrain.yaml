# =============================================================================
# Retrain from Scratch - Server (64GB VRAM, 64-thread budget, 1TB RAM)
# =============================================================================
# Fresh training from random weights (box has 128 cores; this uses ~50%, leaving
# headroom for OS, MIOpen, and torch.compile autotune). Full pass history,
# rationale, and the two-phase imitation-learning plan live in config/Journal.md;
# this file keeps only one-line pointers ("See Journal Pass N").
#
# Usage:
#   bash train_server.sh
#   PYTHONPATH=src python -m dama.ai.ml.trainer \
#       --config config/training_config_server_retrain.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# Device Settings
# -----------------------------------------------------------------------------
device:
  type: "cuda"                            # Maps to the server GPU backend (ROCm/HIP)
  amp:
    enabled: true
    dtype: "bfloat16"                     # Native bf16, no GradScaler. See Journal Pass 74.
  compile:
    enabled: true
    mode: "reduce-overhead"               # max-autotune reverted (per-shape autotune stalls). See Journal Pass 90 + Landmines.
  matmul_precision: "medium"              # TF32-equivalent for float32 matmuls

# -----------------------------------------------------------------------------
# Model Architecture (128/8/256/128)
# -----------------------------------------------------------------------------
model:
  channels: 128                           # CNN channels in ResidualBlocks
  num_blocks: 8                           # Number of residual blocks
  embedding_size: 256                     # Board embedding vector size
  hidden_size: 128                        # MoveScorer MLP hidden layer size

# -----------------------------------------------------------------------------
# Self-Play Settings (100% algorithmic teachers for a fresh model)
# -----------------------------------------------------------------------------
selfplay:
  cpu_workers: 64                         # 64 of 128 threads; idle-thread capacity is freshness vs steps/sec. See Journal Pass 90, 93.
  games_per_epoch: 600                    # 300 P1 + 300 P2; ML ratio 14.3%. See Journal Pass 90 / Reference.
  difficulties:
    - "easy"                              # Learnable signal for a random model.
    - "medium"                            # Adds challenge.
    # - "super_hard"                      # Enable once model is competitive at hard
  focus_side: "both"                      # Equal P1/P2 exposure
  opponent_focus: "algorithm"             # 100% algorithmic teachers (random model self-play = noise)
  noise_prob: 0.20                        # Exploration for a fresh model
  max_moves_per_game: 150                 # Allow endgame play
  pipeline_mode: "simultaneous"           # Overlaps CPU self-play with GPU training
  max_stale_epochs: 500                   # GPU blocks (idles) if self-play can't refresh within 500 epochs. See Journal Pass 90, 93.

  # ALGO-VS-ALGO: 85.7% algo ratio, hard-only = P1-bias risk; disable if P2 WR=0 after step 2000. See Journal Pass 84 + Landmines.
  algo_vs_algo:
    enabled: true
    games_per_epoch: 3600                 # 85.7% algo ratio (3600/(3600+600))
    difficulties:
      #- "easy"
      #- "medium"
      - "hard"
      # - "super_hard"                    # Excluded: ~1s/move, 60% longer cycles. See Journal Pass 8.

# -----------------------------------------------------------------------------
# Training Hyperparameters
# -----------------------------------------------------------------------------
training:
  batch_size: 65536                       # ~19.4GB BF16 of 64GB. See Journal Reference.
  learning_rate: 4.2e-4                   # sqrt-scaled from 3.0e-4 for 2x batch. See Journal Reference.
  weight_decay: 1.0e-4                    # 10x v5; prevents embedding-magnitude explosion. See Journal Reference.
  grad_clip_norm: 1.0                     # Standard gradient clipping
  train_steps: 100000000000               # Unlimited - time_limit controls stopping
  checkpoint_every: 1000                  # Frequent saves for fresh training
  gradient_accumulation_steps: 1          # 64GB fits batch 65536 in one forward pass

  # LR SCHEDULER: ENABLED on server (fresh start, gentle warmup); LOCAL disables it. See Journal Reference + Pass 18.
  lr_scheduler:
    enabled: true
    type: "cosine_warm_restarts"
    T_0: 5000                             # Long first cycle
    T_mult: 2                             # Doubling: 5000, 10000, 20000, ...
    eta_min: 4.2e-5                       # Floor at 10% of base LR
    warmup_steps: 500                     # Gentle warmup; critical for a fresh model

  reward_mode: "scoring"                  # Consistent signal; 'cycle' amplifies P1 bias. See Journal Pass 56.

# -----------------------------------------------------------------------------
# Value Head / TD Learning Settings
# -----------------------------------------------------------------------------
value_head:
  enabled: true                           # Aux value signal helps the encoder; proven in v4. See Journal Reference.
  hidden_size: 128                        # Hidden layer size for value MLP
  value_weight: 0.15                      # 85% policy / 15% value gradient split

# -----------------------------------------------------------------------------
# DataLoader Settings
# -----------------------------------------------------------------------------
dataloader:
  num_workers: 0                          # FastBatchIterator bypasses DataLoader
  pin_memory: true
  prefetch_factor: 2                      # Unused - FastBatchIterator bypasses DataLoader
  replay_max_entries: 5000000             # ~8.5 self-play cycles (~5.9GB VRAM). See Journal Reference.
  clear_replay_after_load: false          # Accumulate data across cycles
  max_moves_per_sample: 32                # Max legal moves in Dama is ~20; 32 saves 50%

  ram_cache:
    enabled: true
    threshold_gb: 64.0                    # 1TB DDR4 available - generous threshold
    cache_file: null

# -----------------------------------------------------------------------------
# Model Testing Settings (ML vs Algorithm)
# -----------------------------------------------------------------------------
testing:
  enabled: true
  every_n_steps: 1000                     # Test every 1000 steps
  num_games: 50                           # Reasonable eval signal
  difficulty: "easy"                      # Start easy; switch to medium once >50% WR. See Journal user actions.

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
paths:
  checkpoint_dir: "models/checkpoints"
  latest_model: "models/latest.pt"
  replay_dir: "data/replay"
  log_dir: "logs/server"
  stats_file: "models/training_stats_server.json"

# -----------------------------------------------------------------------------
# Statistics Collection (sync-reduction cadences - see Journal Reference)
# -----------------------------------------------------------------------------
statistics:
  enabled: true
  record_every: 100                       # was 10; each loss.item() is a CUDA sync
  system_every: 1000                      # was 300; nvidia-smi/psutil are expensive
  model_health_every: 2000                # parameter-norm checks
  score_dist_every: 500                   # was 50; array-wide GPU ops
  buffer_size: 100000                     # Large ring buffer (1TB RAM)
  flush_every: 50                         # was 2000; avoid losing stats on partial runs
  output_dir: "logs/server/stats"

# -----------------------------------------------------------------------------
# Thermal Protection
# -----------------------------------------------------------------------------
thermal_protection:
  enabled: false                          # Server GPU has enterprise active cooling
  temp_limit_c: 90
  rest_duration: "5m"
  check_every: 30

# -----------------------------------------------------------------------------
# Resume Settings
# -----------------------------------------------------------------------------
resume:
  enabled: false                          # Fresh training from random initialization
  checkpoint_path: null
  skip_corrupted: true

# -----------------------------------------------------------------------------
# Time-based Stopping
# -----------------------------------------------------------------------------
time_limit:
  enabled: true
  duration: "6h"
