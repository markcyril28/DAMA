# =============================================================================
# Retrain from Scratch — Server (MI210, 64GB HBM2e, 128 threads, 1TB RAM)
# =============================================================================
# Created 2026-04-05 after discovering all prior checkpoints were degenerate.
#
# Root cause: torch.clamp(-50, 50) in MoveScorer killed gradients once raw
# scores exceeded the clamp range (~step 0). Every checkpoint from step 0
# onward output identical scores (50.0) for all moves. Fix: clamp removed
# from model.py. This config starts training from a fresh random model.
#
# Strategy for fresh training:
#   Phase 1 (steps 0-5K): Pure imitation learning from algorithmic teacher.
#     100% algo opponents, higher noise for exploration, easy+medium difficulty.
#   Phase 2 (steps 5K+): Same config continues — algo teachers remain until
#     the model demonstrates competence (>20% WR vs medium in test games).
#     Manually switch opponent_focus to "both" once that threshold is reached.
#
# Usage:
#   bash train_server.sh
#   — or —
#   PYTHONPATH=src python -m dama.ai.ml.trainer \
#       --config config/training_config_server_retrain.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# Device Settings
# -----------------------------------------------------------------------------
device:
  type: "cuda"                            # "cuda" maps to ROCm/HIP on AMD
  amp:
    enabled: true
    dtype: "bfloat16"                     # bfloat16 — native on MI210 CDNA2, same
                                          # exponent range as FP32. No GradScaler needed.
  compile:
    enabled: true
    mode: "max-autotune"                  # MI210 has VRAM headroom for autotuning.
                                          # Slower to compile (~5 min), faster execution.
                                          # Board is always 8x8, so autotuning pays off.
  matmul_precision: "medium"              # TF32-equivalent for float32 matmuls

# -----------------------------------------------------------------------------
# Model Architecture
# -----------------------------------------------------------------------------
# Same architecture as before. Fresh weights — no checkpoint compatibility
# concern, but keeping the architecture allows reuse of eval_checkpoints.sh
# and model_vs_algo infrastructure without changes.
# -----------------------------------------------------------------------------
model:
  channels: 128                           # CNN channels in ResidualBlocks
  num_blocks: 8                           # Number of residual blocks
  embedding_size: 256                     # Board embedding vector size
  hidden_size: 128                        # MoveScorer MLP hidden layer size

# -----------------------------------------------------------------------------
# Self-Play Settings
# -----------------------------------------------------------------------------
# Fresh model knows nothing — 100% algorithmic teachers, generous exploration.
# algo_vs_algo provides high-quality baseline data from day one.
# With 128 CPU threads, algo_vs_algo can generate large volumes of data
# via Cython fast path.
# -----------------------------------------------------------------------------
selfplay:
  cpu_workers: 32                          # 96 of 128 cores for self-play processes.
                                          # ProcessPoolExecutor uses separate processes
                                          # (not threads), so GIL is not a factor.
                                          # Training uses 1 CPU thread (GPU mode), leaving
                                          # 127 cores available. 96 uses 75%, leaving 32
                                          # for preprocessing + OS. Each Cython worker
                                          # uses ~128MB TT: 96 × 128MB = 12.3GB (trivial
                                          # on 1TB). 50% more workers = ~33% faster
                                          # algo-vs-algo cycles.
  games_per_epoch: 900                    # Increased from 600. With 96 workers (was 64),
                                          # 900 ML games run in parallel with algo games.
                                          # 900 × ~40 moves = ~36K entries/cycle.
                                          # 450 as P1 + 450 as P2 (focus_side="both").
                                          # ML ratio: 900/(900+5400) = 14.3%, same as the
                                          # prior 600/(600+3600) — the workload scaled
                                          # proportionally with the worker count.
  difficulties:
    - "easy"                              # Start with easy — learnable signal for
    - "medium"                            # a random model. Medium adds challenge.
    # - "super_hard"                      # Enable once model is competitive at hard
  focus_side: "both"                      # Equal P1/P2 exposure from the start
  opponent_focus: "algorithm"             # 100% algorithmic teachers. A random model
                                          # playing itself generates pure noise.
  noise_prob: 0.20                        # Higher noise for fresh model — more
                                          # exploration of the move space early on.
  max_moves_per_game: 150                 # Allow endgame play
  pipeline_mode: "simultaneous"           # Overlaps CPU self-play with GPU training.
                                          # Trainer auto-generates initial data if
                                          # replay buffer has < batch_size*10 entries.
  max_stale_epochs: 500                   # During early training (~600K entries), each
                                          # epoch ≈9 batches ≈ 0.1s. Self-play takes ~3 min.
                                          # 500 epochs = ~4500 steps = ~50s of training,
                                          # keeping the GPU busy for ~22% of the cycle
                                          # (50s / (180s + 50s)).
                                          # (was 150 = ~15s = 8% GPU utilization early on.)
                                          # As the dataset grows to 5M entries, each epoch
                                          # takes ~4.6s (76 batches), so the GPU can only
                                          # complete ~39 epochs/cycle — never hitting the cap.
                                          # The cap only matters in the early phase.
                                          # MI210 has enterprise cooling; thermal not a concern.

  # ALGO-VS-ALGO: WARNING — 85.7% algo data with hard-only = P1 bias risk.
  # [Pass 84] Hard games have 99.7% P1 win rate. reward_mode=scoring
  # AMPLIFIES this (winning moves get 2x weight → P1 moves dominate).
  # Local training with 95% algo ratio diverged for this exact reason.
  # Server ratio (85.7%) is better but still risky. Monitor P1/P2 win rates
  # closely. If P2 WR stays 0% after step 2000, disable algo_vs_algo.
  algo_vs_algo:
    enabled: true
    games_per_epoch: 5400                 # With 96 workers, 5400 games ≈ same wall time as
                                          # 3600 with 64 workers (56 games/worker).
                                          # Algo ratio: 5400/(5400+900) = 85.7%.
    difficulties:                         # Hard-only: 99.7% P1 win rate — see warning above.
      #- "easy"                            # Enabling easy/medium would reduce P1 bias.
      #- "medium"                          # Consider switching to easy+medium if P2 WR = 0%.
      - "hard"
      # - "super_hard"                    # Excluded: ~1s/move, 60% longer cycles

# -----------------------------------------------------------------------------
# Training Hyperparameters
# -----------------------------------------------------------------------------
training:
  batch_size: 65536                       # Doubled from 32768. MI210 has 64GB HBM2e.
                                          # VRAM at 65536 BF16: ~19.4GB (30% of 64GB).
                                          # Still leaves ~38GB for GPU-resident data +
                                          # torch.compile workspace. Better CU occupancy.
  learning_rate: 4.2e-4                   # Sqrt-scaled from 3.0e-4 for 2x batch:
                                          #   lr_new = 3.0e-4 × sqrt(2) = 4.24e-4
                                          #   rounded to 4.2e-4.
  weight_decay: 1.0e-4                    # 10x higher than v5 — helps prevent
                                          # embedding magnitude explosion that caused
                                          # the original degeneration.
  grad_clip_norm: 1.0                     # Standard gradient clipping
  train_steps: 100000000000               # Unlimited — time_limit controls stopping
  checkpoint_every: 1000                  # Frequent saves for fresh training —
                                          # lets eval_checkpoints.sh track progress
                                          # at fine granularity.
  gradient_accumulation_steps: 1          # Not needed — MI210 64GB can fit batch=65536
                                          # in a single forward pass (~19.4GB VRAM).
                                          # Effective batch equals batch_size (65536).

  lr_scheduler:
    enabled: true
    type: "cosine_warm_restarts"
    T_0: 5000                             # Long first cycle — let the model learn
                                          # before any LR disruption.
    T_mult: 2                             # Doubling: 5000, 10000, 20000, ...
    eta_min: 4.2e-5                       # Floor at 10% of base LR (4.2e-4)
    warmup_steps: 500                     # Gentle warmup from near-zero to base LR.
                                          # Critical for fresh model — prevents
                                          # large early gradients from destabilizing.

  reward_mode: "scoring"                  # Consistent reward signal. "cycle" amplifies
                                          # P1 bias on scoring epochs (high weight for P1
                                          # winning moves, low for P2 losing moves).
                                          # Matches local_retrain rationale (pass 56).

# -----------------------------------------------------------------------------
# Value Head / TD Learning Settings
# -----------------------------------------------------------------------------
value_head:
  enabled: true
  hidden_size: 128                        # Hidden layer size for value MLP
  value_weight: 0.15                      # 85% policy / 15% value gradient split.

# -----------------------------------------------------------------------------
# DataLoader Settings
# -----------------------------------------------------------------------------
dataloader:
  num_workers: 0                          # FastBatchIterator bypasses DataLoader
  pin_memory: true
  prefetch_factor: 2                          # Unused — FastBatchIterator bypasses DataLoader
  replay_max_entries: 5000000             # 5M entries x ~1.2KB (fp16 on GPU, 32 slots) = ~5.9GB VRAM (of 64GB).
                                          # With batch=65536 activations ~19.4GB + data ~5.9GB = ~25.4GB total,
                                          # leaving ~38.6GB free. Retains ~8.5 self-play cycles of data.
  clear_replay_after_load: false          # Accumulate data across cycles
  max_moves_per_sample: 32                # Max legal moves in Dama is ~20; 32 saves 50% vs old default of 64

  ram_cache:
    enabled: true
    threshold_gb: 64.0                    # 1TB DDR4 available — generous threshold
    cache_file: null

# -----------------------------------------------------------------------------
# Model Testing Settings (ML vs Algorithm)
# -----------------------------------------------------------------------------
# Frequent testing for fresh training — want to see the learning curve.
# -----------------------------------------------------------------------------
testing:
  enabled: true
  every_n_steps: 1000                     # Test every 1000 steps
  num_games: 50                           # 50 games — reasonable eval signal
  difficulty: "easy"                      # Start easy — fresh model at 0% WR vs medium.
                                          # Switch to medium once >50% WR vs easy.

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
paths:
  checkpoint_dir: "models/checkpoints"
  latest_model: "models/latest.pt"
  replay_dir: "data/replay"
  log_dir: "logs"
  stats_file: "models/training_stats.json"

# -----------------------------------------------------------------------------
# Statistics Collection
# -----------------------------------------------------------------------------
statistics:
  enabled: true
  record_every: 100                       # Was 10. Each record triggers loss.item() CUDA sync
                                          # (~20-100μs). At 100, 90% fewer GPU pipeline stalls.
                                          # Still 1000+ data points per self-play cycle.
  system_every: 1000                      # Was 300. System metrics are expensive (nvidia-smi/psutil).
  model_health_every: 2000                # Monitor embedding magnitudes. Each check computes
                                          # norms on ~40 params + 1 batched CUDA sync.
  score_dist_every: 500                   # Was 50. Score stats do array-wide ops on GPU tensors.
                                          # 500 still gives granular distribution tracking.
  buffer_size: 100000                     # Large ring buffer — 1TB RAM is abundant
  flush_every: 2000                       # Was 1000. Disk I/O on training thread — reduce 2x.
  output_dir: "logs/stats"

# -----------------------------------------------------------------------------
# Thermal Protection
# -----------------------------------------------------------------------------
thermal_protection:
  enabled: false                          # MI210 has enterprise active cooling
  temp_limit_c: 90
  rest_duration: "5m"
  check_every: 30

# -----------------------------------------------------------------------------
# Resume Settings
# -----------------------------------------------------------------------------
# DISABLED — fresh training from random initialization.
# -----------------------------------------------------------------------------
resume:
  enabled: false
  checkpoint_path: null
  skip_corrupted: true

# -----------------------------------------------------------------------------
# Time-based Stopping
# -----------------------------------------------------------------------------
time_limit:
  enabled: true
  duration: "6h"
