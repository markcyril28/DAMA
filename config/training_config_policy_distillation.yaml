# Policy-distillation recovery configuration
# Approved baseline: model_step_134000.pt only. This run has no fresh-weight arm.

device:
  type: "cuda"
  amp:
    enabled: true
    dtype: "bfloat16"
  compile:
    enabled: false
    mode: "reduce-overhead"
  matmul_precision: "medium"

model:
  channels: 128
  num_blocks: 8
  embedding_size: 256
  hidden_size: 128

selfplay:
  cpu_workers: 12

  # Exactly 72 of 240 trajectories come from the frozen current model.
  games_per_epoch: 72
  difficulties: ["easy", "medium", "hard"]
  focus_side: "both"
  opponent_focus: "algorithm"

  # Exploration changes the played action only. Every stored label is from hard.
  noise_prob: 0.10
  teacher_difficulty: "hard"
  opening_plies: [2, 4, 6, 8]
  opening_seed: 20260819
  max_moves_per_game: 200
  pipeline_mode: "simultaneous"
  max_stale_epochs: 100
  persist_selfplay: true

  generation_mix:
    total_games_per_cycle: 240
    algorithm_fraction: 0.70
    model_fraction: 0.30

  # Exactly 168 of 240 trajectories use diverse algorithm behavior.
  # Hard teacher relabeling is independent of these behavior difficulties.
  algo_vs_algo:
    enabled: true
    games_per_epoch: 168
    difficulties: ["easy", "medium", "hard"]

# No useful nontrivial symmetry is available. The rules-valid 180 degree
# rotation with player swap is already identical after side-to-move encoding.
augmentation:
  symmetry: "none"

training:
  stage: "policy_only"
  batch_size: 2048
  learning_rate: 2.0e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  train_steps: 100000000000
  checkpoint_every: 2000
  gradient_accumulation_steps: 1
  reward_mode: "none"
  lr_scheduler:
    enabled: false
    type: "cosine_warm_restarts"
    T_0: 5000
    T_mult: 2
    eta_min: 5.0e-5
    warmup_steps: 200

# The active recovery stage remains one-hot policy-only. The enhanced settings
# are implemented but cannot activate until a policy-only promotion is recorded.
teacher_policy:
  target_type: "hard"
  teacher_difficulty: "hard"
  temperature: 1.0
  score_depth: 3
  value_scale: 1000.0
  hard_label_blend: 0.25
  require_policy_gate: true

value_head:
  enabled: false
  hidden_size: 128
  value_weight: 0.15

validation:
  enabled: true
  split_fraction: 0.15
  split_seed: 20260819
  every_checkpoints: 1
  frozen_suite_path: "data/validation_policy_distillation/frozen_hard_5000.jsonl"
  frozen_suite_size: 5000
  frozen_suite_seed: 20260819
  auto_create_suite: true
  teacher_agreement_threshold: 0.50

corpus_snapshots:
  enabled: true
  root: "data/corpus_snapshots/policy_distillation"
  minimum_fresh_state_fraction: 0.50

dataloader:
  num_workers: 0
  pin_memory: true
  prefetch_factor: 2
  replay_max_entries: 1000000
  replay_max_files: 60
  clear_replay_after_load: false
  max_moves_per_sample: 32
  ram_cache:
    enabled: true
    threshold_gb: 16.0
    cache_file: "data/replay_cache/policy_distillation_cache.pt"

# Game strength is evaluated only after held-out teacher-agreement promotion.
# Each opponent receives 100 games, exactly 50 on each player side.
testing:
  enabled: true
  promoted_only: true
  every_n_steps: 2000
  num_games: 100
  opponents: ["random", "easy"]
  difficulty: "easy"
  opening_plies: [2, 4, 6, 8]
  opening_seed: 20260819
  confidence_method: "wilson_score"
  confidence_level: 0.95
  random_match_score_threshold: 0.80
  random_lower_confidence_bound: 0.70
  easy_lower_confidence_bound: 0.50
  easy_side_score_floor: 0.50
  inference_depth: 1

paths:
  checkpoint_dir: "models/checkpoints_policy_distillation"
  latest_model: "models/latest_policy_distillation.pt"
  promoted_model: "models/promoted_policy_distillation.pt"
  accepted_model: "models/accepted_policy_distillation.pt"
  replay_dir: "data/replay_policy_distillation"
  log_dir: "logs/policy_distillation"
  stats_file: "models/training_stats_policy_distillation.json"
  promotion_registry: "logs/policy_distillation/promotions.jsonl"
  acceptance_dir: "logs/policy_distillation/acceptance"

statistics:
  enabled: true
  record_every: 200
  progress_report_every_seconds: 300
  system_every: 5000
  model_health_every: 5000
  score_dist_every: 500
  buffer_size: 50000
  flush_every: 500
  output_dir: "logs/policy_distillation/stats"

thermal_protection:
  enabled: true
  temp_limit_c: 89
  rest_duration: "10m"
  check_every: 30

resume:
  enabled: true
  checkpoint_path: "models/checkpoints_policy_distillation/model_step_134000.pt"
  skip_corrupted: false

recovery_experiment:
  enabled: true
  baseline_checkpoint: "models/checkpoints_policy_distillation/model_step_134000.pt"
  baseline_sha256: "7238CD80F2EF6DC9D8487D2579DE4BDF35AF4B85DCB2B3BD271659E795B14D27"

time_limit:
  enabled: true
  duration: "48h"

profiles:
  server:
    device:
      type: "cuda"
      amp:
        enabled: true
        dtype: "bfloat16"
      compile:
        enabled: true
        mode: "reduce-overhead"
      matmul_precision: "medium"

    selfplay:
      cpu_workers: 64
      games_per_epoch: 360
      max_stale_epochs: 500
      generation_mix:
        total_games_per_cycle: 1200
        algorithm_fraction: 0.70
        model_fraction: 0.30
      algo_vs_algo:
        enabled: true
        games_per_epoch: 840
        difficulties: ["easy", "medium", "hard", "super_hard"]

    training:
      batch_size: 65536
      learning_rate: 4.2e-4
      weight_decay: 1.0e-4
      checkpoint_every: 2000
      lr_scheduler:
        enabled: true
        type: "cosine_warm_restarts"
        T_0: 5000
        T_mult: 2
        eta_min: 4.2e-5
        warmup_steps: 500

    dataloader:
      replay_max_entries: 5000000
      ram_cache:
        enabled: true
        threshold_gb: 64.0
        cache_file: "data/replay_cache/policy_distillation_server_cache.pt"

    thermal_protection:
      enabled: false

    time_limit:
      enabled: true
      duration: "10h"
