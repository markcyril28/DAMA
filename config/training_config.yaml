# =============================================================================
# Micro Training Configuration
# =============================================================================
# This is the centralized configuration file for training hyperparameters.
# It consolidates settings from train_server.sh, local_train.sh, and trainer.py.
#
# Usage:
#   python -m dama.ai.ml.trainer --config config/training_config.yaml
#
# Override any setting via command line:
#   python -m dama.ai.ml.trainer --config config/training_config.yaml --batch-size 512
# =============================================================================

# -----------------------------------------------------------------------------
# Device Settings
# -----------------------------------------------------------------------------
device:
  type: "cuda"                        # "cuda" (ROCm/HIP or CUDA) or "cpu"
  amp:
    enabled: true                     # Enable automatic mixed precision
    dtype: "bfloat16"                 # "bfloat16" (recommended for MI210) or "float16"
  compile:
    enabled: true                     # Enable torch.compile for faster training
    mode: "reduce-overhead"           # "default", "reduce-overhead", "max-autotune"
                                      # forward_padded uses fixed-size ops → fullgraph=True + CUDAGraphs
  matmul_precision: "medium"          # "highest", "high", "medium" - medium enables TF32

# -----------------------------------------------------------------------------
# Model Architecture
# -----------------------------------------------------------------------------
# Architecture params are saved in checkpoints for portable loading.
# Changing these starts a NEW model (incompatible with existing checkpoints).
# -----------------------------------------------------------------------------
model:
  channels: 64                        # CNN channels in ResidualBlocks
  num_blocks: 4                       # Number of residual blocks
  embedding_size: 128                 # Board embedding vector size
  hidden_size: 64                     # MoveScorer MLP hidden layer size

# -----------------------------------------------------------------------------
# Self-Play Settings
# -----------------------------------------------------------------------------
selfplay:
  cpu_workers: 48                     # Number of CPU workers for self-play
  games_per_epoch: 2048               # Number of games to generate per epoch
  difficulties:                       # List of difficulties to cycle through
    - "easy"
    - "medium"
    - "hard"
    - "super_hard"
  focus_side: "both"                  # "white", "black", or "both"
  opponent_focus: "both"              # "ml", "algorithm", or "both"
  noise_prob: 0.20                    # Probability of random move for exploration
  max_moves_per_game: 100             # Maximum moves per game
  pipeline_mode: "simultaneous"       # "simultaneous" = generate data on CPU while training on GPU (overlapped)
                                      # "alternate"     = generate all data first, then train (sequential)

  # Algo-vs-algo: pure algorithmic games as additional training data.
  # Generates games between all difficulty matchup pairs (e.g., easy-vs-easy,
  # easy-vs-medium, easy-vs-hard, medium-vs-medium, medium-vs-hard, hard-vs-hard).
  algo_vs_algo:
    enabled: true                     # Include algo-vs-algo games in training data
    games_per_epoch: 200              # Additional games per self-play epoch
    difficulties:                     # Difficulties to combine into matchup pairs
      - "easy"                        # Exclude super_hard: ~60% longer cycles per
      - "medium"                      # pass 8 analysis (39min → 15min on local hw).
      - "hard"                        # Re-enable for server only when needed.

# -----------------------------------------------------------------------------
# Training Hyperparameters
# -----------------------------------------------------------------------------
training:
  batch_size: 1024                    # Training batch size
  learning_rate: 1.0e-4               # Learning rate (lower for FP32 stability)
  weight_decay: 1.0e-5                # Weight decay for regularization
  grad_clip_norm: 1.0                 # Gradient clipping norm (null to disable)
  train_steps: 100000000000           # Total training steps
  checkpoint_every: 2000              # Save checkpoint every N steps

  # Learning rate schedule (enable for better convergence)
  lr_scheduler:
    enabled: true                     # Enable LR scheduler
    type: "cosine_warm_restarts"      # Cosine annealing with warm restarts
    T_0: 500                          # Steps for first cosine cycle
    T_mult: 2                         # Cycle length multiplier after each restart
    eta_min: 1.0e-5                   # Minimum LR
    warmup_steps: 200                 # Linear warmup from ~0 to base LR

  # Gradient accumulation: effective_batch = batch_size * gradient_accumulation_steps.
  # Use >1 on memory-constrained hardware to get larger effective batches.
  gradient_accumulation_steps: 1

  # Reward scoring mode for training loss weighting:
  #   "scoring" - always use the scoring system reward weights
  #   "none"    - never use scoring (uniform weights, classic behavior)
  #   "cycle"   - alternate epochs: odd=scoring, even=uniform (default)
  reward_mode: "cycle"

# -----------------------------------------------------------------------------
# DataLoader Settings
# -----------------------------------------------------------------------------
dataloader:
  num_workers: 16                     # Number of dataloader worker processes
  pin_memory: true                    # Pin memory for faster GPU transfer
  prefetch_factor: 3                  # Batches to prefetch per worker
  replay_max_entries: 100000          # Max entries sampled from replay buffer per epoch
  clear_replay_after_load: false      # Delete replay JSONL files after loading into memory
                                      # Frees disk space and prevents re-training on stale data.
                                      # New self-play data is generated fresh each epoch regardless.

  # RAM Caching (see IMPROVEMENTS.md)
  ram_cache:
    enabled: true                     # Enable RAM caching for pre-tensorized data
    threshold_gb: 16.0                # Minimum available RAM (GB) to enable caching
    cache_file: null                  # Optional: path to save/load cached tensors (.pt)

# -----------------------------------------------------------------------------
# Model Testing Settings (ML vs Algorithm)
# -----------------------------------------------------------------------------
testing:
  enabled: false                      # Enable periodic testing against algorithm
  every_n_steps: 5000                 # Test every N training steps
  num_games: 50                       # Number of test games per evaluation
  difficulty: "medium"                # Algorithm difficulty for testing

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
paths:
  checkpoint_dir: "models/checkpoints"
  latest_model: "models/latest.pt"
  replay_dir: "data/replay"
  log_dir: "logs"
  stats_file: "models/training_stats.json"

# -----------------------------------------------------------------------------
# Statistics Collection (for optimization analysis)
# -----------------------------------------------------------------------------
statistics:
  enabled: true                       # Enhanced stats collection (JSON + CSV exports)
  record_every: 500                   # Record loss/gradients every N steps (each triggers .item() CUDA sync)
  system_every: 2000                  # Record GPU/CPU/RAM metrics every N steps
  model_health_every: 5000            # Record parameter norms every N steps
  score_dist_every: 500               # Record score distribution every N steps
  buffer_size: 50000                  # Ring buffer size
  flush_every: 5000                   # Flush incremental stats every N steps
  output_dir: "logs/stats"            # Export directory

# -----------------------------------------------------------------------------
# Thermal Protection
# -----------------------------------------------------------------------------
# Pauses training when GPU or CPU temperature exceeds the threshold.
# After resting for the configured duration, training resumes automatically.
thermal_protection:
  enabled: false                       # Enable thermal throttle protection
  temp_limit_c: 90                     # Temperature threshold in Celsius
  rest_duration: "5m"                  # Rest duration when limit is hit (e.g., "5m", "10m", "1m30s")
  check_every: 30                      # Check temperature every N seconds (avoid excessive polling)

# -----------------------------------------------------------------------------
# Resume Settings
# -----------------------------------------------------------------------------
resume:
  enabled: true                       # Enable auto-resume from latest checkpoint
  checkpoint_path: null               # Specific checkpoint path (null = auto-detect)
  skip_corrupted: true                # Skip checkpoints with NaN/Inf values

# -----------------------------------------------------------------------------
# Time-based Stopping
# -----------------------------------------------------------------------------
time_limit:
  enabled: true
  duration: "7h"                      # Training duration (e.g., "2h", "1d12h", "30m")

# =============================================================================
# Hardware-Specific Profiles
# =============================================================================
# These are example profiles for different hardware configurations.
# Use the --profile flag to select a profile:
#   python -m dama.ai.ml.trainer --config config/training_config.yaml --profile server
# =============================================================================

profiles:
  # AMD MI210 Server (64GB VRAM, 128 CPU threads, 1TB RAM)
  server:
    device:
      type: "cuda"
      amp:
        enabled: true
        dtype: "bfloat16"
      compile:
        mode: "max-autotune"          # MI210 benefits from max-autotune (large VRAM)
    selfplay:
      cpu_workers: 112                # 128 cores − 16 reserved for training I/O + preprocessing
      games_per_epoch: 32768          # Proportional to batch size — keeps GPU fed
      pipeline_mode: "simultaneous"   # Overlap CPU self-play with GPU training
    training:
      batch_size: 32768               # 64GB VRAM — ~6.4GB activations, still <10% VRAM
      learning_rate: 5.6e-4           # Sqrt-scaled from 4e-4 at 16384 (x1.41)
      gradient_accumulation_steps: 1
      lr_scheduler:
        enabled: true
        warmup_steps: 400             # Longer warmup for larger batch (proportional to sqrt(batch))
    dataloader:
      num_workers: 0                  # FastBatchIterator bypasses DataLoader — workers unused
      replay_max_entries: 2000000     # 1TB RAM — ~7GB for 2M entries, maximize diversity
      ram_cache:
        enabled: true
        threshold_gb: 64.0

  # Local development (NVIDIA RTX 5050, 8GB VRAM, 12 CPU cores, 32GB RAM)
  # WARNING: This profile does NOT override model architecture. The main config
  # uses 64/4/128/64 which is INCOMPATIBLE with local checkpoints (128/8/256/128).
  # Use training_config_local.yaml directly for local training.
  local:
    device:
      type: "cuda"
      amp:
        enabled: true
        dtype: "float16"
      compile:
        enabled: true
        mode: "reduce-overhead"        # SM-count guard auto-downgrades to 'default' on small GPUs
    selfplay:
      cpu_workers: 10
      games_per_epoch: 200
      difficulties:                       # Exclude super_hard — 5s/move is too slow for 12 cores
        - "easy"
        - "medium"
        - "hard"
      pipeline_mode: "simultaneous"
      algo_vs_algo:
        games_per_epoch: 900              # [Pass 17 fix]: Was 200 (stale). Matches local.yaml.
        difficulties:                     # Exclude super_hard for local hardware
          - "easy"
          - "medium"
          - "hard"
    training:
      batch_size: 4096                  # [Pass 17 fix]: Was 8192 (stale). Matches local.yaml.
      learning_rate: 1.5e-4
      gradient_accumulation_steps: 1
      lr_scheduler:
        enabled: false                  # [Pass 17 fix]: Was true (fell through from base).
                                        # LR scheduler caused catastrophic regression in prior run.
        warmup_steps: 100
    dataloader:
      num_workers: 0
      replay_max_entries: 600000        # 32GB RAM — ~2.1GB cached, ~1.8GB on GPU
      ram_cache:
        enabled: true
        threshold_gb: 16.0
    thermal_protection:
      enabled: true
      temp_limit_c: 90
      rest_duration: "5m"
      check_every: 30

  # CPU-only training
  cpu:
    device:
      type: "cpu"
      amp:
        enabled: false
    selfplay:
      cpu_workers: 4
      games_per_epoch: 50
    training:
      batch_size: 64
      learning_rate: 1.0e-4
    dataloader:
      num_workers: 2
      ram_cache:
        enabled: true
        threshold_gb: 8.0
