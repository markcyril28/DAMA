# =============================================================================
# Policy Distillation From Stronger Search - SERVER
# =============================================================================
# Goal:
#   Generate teacher targets from deeper algorithmic search and train the model
#   to imitate the strongest available move.
#
# Server profile notes:
#   - high-throughput inference settings (compile on, larger batch)
#   - larger self-play and replay buffers
#   - longer run-time budget by config default (10h)
#
# Usage:
#   PYTHONPATH=src python -m dama.ai.ml.trainer \
#       --config config/training_config_server_policy_distillation.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# Device Settings
# -----------------------------------------------------------------------------
device:
  type: "cuda"
  amp:
    enabled: true
    dtype: "bfloat16"
  compile:
    enabled: true
    mode: "reduce-overhead"
  matmul_precision: "medium"

# -----------------------------------------------------------------------------
# Model Architecture
# -----------------------------------------------------------------------------
model:
  channels: 128
  num_blocks: 8
  embedding_size: 256
  hidden_size: 128

# -----------------------------------------------------------------------------
# Policy Distillation Data Generation
# -----------------------------------------------------------------------------
selfplay:
  cpu_workers: 32
  games_per_epoch: 0
  difficulties:
    - "hard"
    - "super_hard"
  focus_side: "both"
  opponent_focus: "algorithm"
  noise_prob: 0.0
  max_moves_per_game: 150
  pipeline_mode: "simultaneous"
  max_stale_epochs: 500

  algo_vs_algo:
    enabled: true
    games_per_epoch: 1200
    difficulties:
      - "hard"
      - "super_hard"

# -----------------------------------------------------------------------------
# Training Hyperparameters
# -----------------------------------------------------------------------------
training:
  batch_size: 65536
  learning_rate: 4.2e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  train_steps: 100000000000
  checkpoint_every: 1000
  gradient_accumulation_steps: 1

  lr_scheduler:
    enabled: true
    type: "cosine_warm_restarts"
    T_0: 5000
    T_mult: 2
    eta_min: 4.2e-5
    warmup_steps: 500

  reward_mode: "none"

# -----------------------------------------------------------------------------
# Value Head
# -----------------------------------------------------------------------------
value_head:
  enabled: false
  hidden_size: 128
  value_weight: 0.15

# -----------------------------------------------------------------------------
# DataLoader Settings
# -----------------------------------------------------------------------------
dataloader:
  num_workers: 0
  pin_memory: true
  prefetch_factor: 2
  replay_max_entries: 5000000
  clear_replay_after_load: false
  max_moves_per_sample: 32

  ram_cache:
    enabled: true
    threshold_gb: 64.0
    cache_file: "data/replay_cache/policy_distillation_server_cache.pt"

# -----------------------------------------------------------------------------
# Model Testing Settings
# -----------------------------------------------------------------------------
testing:
  enabled: true
  every_n_steps: 1000
  num_games: 50
  difficulty: "easy"

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
paths:
  checkpoint_dir: "models/checkpoints_policy_distillation_server"
  latest_model: "models/latest_policy_distillation_server.pt"
  replay_dir: "data/replay_policy_distillation_server"
  log_dir: "logs/server/policy_distillation"
  stats_file: "models/training_stats_policy_distillation_server.json"

# -----------------------------------------------------------------------------
# Statistics Collection
# -----------------------------------------------------------------------------
statistics:
  enabled: true
  record_every: 200
  system_every: 5000
  model_health_every: 5000
  score_dist_every: 500
  buffer_size: 50000
  flush_every: 500
  output_dir: "logs/server/policy_distillation/stats"

# -----------------------------------------------------------------------------
# Thermal Protection
# -----------------------------------------------------------------------------
thermal_protection:
  enabled: false
  temp_limit_c: 89
  rest_duration: "10m"
  check_every: 30

# -----------------------------------------------------------------------------
# Resume Settings
# -----------------------------------------------------------------------------
resume:
  enabled: true
  checkpoint_path: null
  skip_corrupted: true

# -----------------------------------------------------------------------------
# Time-based Stopping
# -----------------------------------------------------------------------------
time_limit:
  enabled: true
  duration: "10h"

