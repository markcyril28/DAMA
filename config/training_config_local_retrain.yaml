# =============================================================================
# Retrain from Scratch — Local (RTX 5050, 8GB VRAM, 12 cores, 32GB RAM)
# =============================================================================
# Created 2026-04-05 after discovering all prior checkpoints were degenerate.
#
# Root cause: torch.clamp(-50, 50) in MoveScorer killed gradients once raw
# scores exceeded the clamp range (~step 0). Every checkpoint from step 0
# onward output identical scores (50.0) for all moves. Fix: clamp removed
# from model.py. This config starts training from a fresh random model.
#
# Strategy for fresh training:
#   Phase 1 (steps 0-5K): Pure imitation learning from algorithmic teacher.
#     100% algo opponents, higher noise for exploration, easy+medium difficulty.
#   Phase 2 (steps 5K+): Same config continues — algo teachers remain until
#     the model demonstrates competence (>20% WR vs medium in test games).
#     Manually switch opponent_focus to "both" once that threshold is reached.
#
# Usage:
#   bash local_train.sh  (after updating it to point here)
#   — or —
#   PYTHONPATH=src python -m dama.ai.ml.trainer \
#       --config config/training_config_local_retrain.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# Device Settings
# -----------------------------------------------------------------------------
device:
  type: "cuda"
  amp:
    enabled: true
    dtype: "float16"                    # float16 + GradScaler for RTX 5050
  compile:
    enabled: true                       # SM-count guard in trainer.py auto-downgrades
    mode: "reduce-overhead"             # to mode='default' on small GPUs (RTX 5050).
                                        # Shapes are fixed (batch=7200, board=5x8x8,
                                        # moves=64x8) so no recompilation churn.
  matmul_precision: "medium"            # TF32 enabled

# -----------------------------------------------------------------------------
# Model Architecture
# -----------------------------------------------------------------------------
# Same architecture as before. Fresh weights — no checkpoint compatibility
# concern, but keeping the architecture allows reuse of eval_checkpoints.sh
# and model_vs_algo infrastructure without changes.
# -----------------------------------------------------------------------------
model:
  channels: 128                         # CNN channels in ResidualBlocks
  num_blocks: 8                         # Number of residual blocks
  embedding_size: 256                   # Board embedding vector size
  hidden_size: 128                      # MoveScorer MLP hidden layer size

# -----------------------------------------------------------------------------
# Self-Play Settings
# -----------------------------------------------------------------------------
# Fresh model knows nothing — 100% algorithmic teachers, generous exploration.
# algo_vs_algo provides high-quality baseline data from day one.
# -----------------------------------------------------------------------------
selfplay:
  cpu_workers: 8                     # 8 of 12 cores for self-play workers.
                                     # Simultaneous mode: GPU trains while CPU
                                     # generates. 8 workers improves data throughput;
                                     # 4 remaining cores handle system/GPU driver.
  games_per_epoch: 200                  # ML-vs-algo games per cycle.
                                        # 200 games x ~40 moves = ~8K entries/cycle.
                                        # [Pass 16]: Doubled from 100. At 100 games with
                                        # 14400 algo games, ML signal was only 0.69% of
                                        # data — too diluted for the model to learn from
                                        # its own play. 200 games + 3600 algo = ~24% ML.
  difficulties:
    - "easy"                            # Start with easy — learnable signal for
    - "medium"                          # a random model. Medium adds challenge.
    # - "super_hard"                    # Enable once model is competitive at hard
  focus_side: "both"                    # Equal P1/P2 exposure from the start
  opponent_focus: "algorithm"           # 100% algorithmic teachers. A random model
                                        # playing itself generates pure noise.
  noise_prob: 0.18                      # [Pass 15]: Reduced from 0.20. Model has 2K
                                        # steps — slightly less noise is appropriate.
                                        # Still above 0.15 "established" threshold.
  max_moves_per_game: 150               # Allow endgame play
  pipeline_mode: "simultaneous"     # [Pass 15 fix]: Buffer is populated (600K entries).
                                        # GPU trains on existing data while CPU generates
                                        # new games in background. Was "alternate" for
                                        # initial empty-buffer phase (auto-generates data
                                        # if buffer < batch_size*10).

  algo_vs_algo:
    enabled: true
    games_per_epoch: 3600                # [Pass 16]: Reduced from 14400. Was drowning
                                        # ML signal (0.69%). Now ~25K algo entries/cycle
                                        # vs ~8K ML entries = 24% ML ratio. Still fast:
                                        # Cython ~3ms/easy, ~378ms/hard, ~2 min total.
    difficulties:                       # Exclude super_hard — per pass 8 analysis,
      - "easy"                          # super_hard matchups cause 60% longer cycles
      - "medium"                        # (~39min → ~15min). Cython TT helps but
      - "hard"                          # super_hard still ~1s/move, not worth it.
      # - "super_hard"                   # Excluded: ~1s/move, 60% longer cycles

# -----------------------------------------------------------------------------
# Training Hyperparameters
# -----------------------------------------------------------------------------
training:
  batch_size: 3600                       # VRAM budget: 8GB total,
                                        # ~1.8GB dataset (600K, GPU-resident via 55%
                                        # threshold), ~1.5GB activations, ~0.5GB other
                                        # ≈ 3.8GB peak. Maximizes tensor core occupancy.
                                        # ~83 batches/epoch at 600K buffer.
  learning_rate: 3.0e-4                 # Standard rate for fresh training with
                                        # Adam. Not too aggressive, not too slow.
                                        # Effective batch is 14400 (grad_accum=2),
                                        # but LR stays the same — Adam is scale-invariant.
  weight_decay: 1.0e-4                  # 10x higher than before — helps prevent
                                        # embedding magnitude explosion that caused
                                        # the original degeneration.
  grad_clip_norm: 1.0                   # Standard gradient clipping
  train_steps: 100000000000             # Unlimited — time_limit controls stopping
  checkpoint_every: 1000                # More frequent saves for fresh training —
                                        # lets eval_checkpoints.sh track progress
                                        # at fine granularity.
  gradient_accumulation_steps: 2        # Effective batch 14400. Doubles compute per
                                        # optimizer step without extra VRAM peak.

  lr_scheduler:
    enabled: true
    type: "cosine_warm_restarts"
    T_0: 5000                           # Long first cycle — let the model learn
                                        # before any LR disruption.
    T_mult: 2                           # Doubling: 5000, 10000, 20000, ...
    eta_min: 3.0e-5                     # Floor at 10% of base LR
    warmup_steps: 500                   # Gentle warmup from near-zero to base LR.
                                        # Critical for fresh model — prevents
                                        # large early gradients from destabilizing.

  reward_mode: "cycle"                  # Alternate scoring/uniform epochs

# -----------------------------------------------------------------------------
# DataLoader Settings
# -----------------------------------------------------------------------------
dataloader:
  num_workers: 0                        # FastBatchIterator bypasses DataLoader
  pin_memory: true
  replay_max_entries: 600000            # 600K entries x ~3.5KB = ~2.1GB RAM.
                                        # GPU-resident: ~1.8GB VRAM (fits in 55% threshold).
                                        # More data diversity = less overfitting on stale data.
  clear_replay_after_load: false        # Accumulate data across cycles

  ram_cache:
    enabled: true
    threshold_gb: 8.0                   # 32GB system — 8GB leaves headroom for
                                        # OS + 8 self-play workers + dataloader.
    cache_file: null

# -----------------------------------------------------------------------------
# Model Testing Settings (ML vs Algorithm)
# -----------------------------------------------------------------------------
# Frequent testing for fresh training — want to see the learning curve.
# -----------------------------------------------------------------------------
testing:
  enabled: true
  every_n_steps: 1000                   # Test every 1000 steps
  num_games: 30                         # 30 games — fast eval, directional signal
  difficulty: "easy"                    # [Pass 15 fix]: Was "medium" — 0% WR at 2K steps
                                        # gives no signal. Test vs easy first to detect
                                        # early progress. Switch to "medium" once model
                                        # beats easy at >50% consistently.

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
paths:
  checkpoint_dir: "models/checkpoints"
  latest_model: "models/latest.pt"
  replay_dir: "data/replay"
  log_dir: "logs"
  stats_file: "models/training_stats.json"

# -----------------------------------------------------------------------------
# Statistics Collection
# -----------------------------------------------------------------------------
statistics:
  enabled: true
  record_every: 200                     # [Pass 17]: 100 was excessive — each record
                                        # triggers .item() CUDA sync. 200 gives 2-3
                                        # gradient records per flush (flush_every=500).
  system_every: 5000
  model_health_every: 1000              # [Pass 17]: Embedding explosion was root cause
                                        # of original degeneration. Monitor closely.
  score_dist_every: 500                 # Track score distributions to verify
                                        # the model is actually differentiating moves.
  buffer_size: 50000
  flush_every: 500                      # [Pass 15 fix]: Was 5000 — exceeded the 2K
                                        # steps trained, so logs/stats/ was empty.
                                        # 500 ensures stats are written every 500 steps.
  output_dir: "logs/stats"

# -----------------------------------------------------------------------------
# Thermal Protection
# -----------------------------------------------------------------------------
thermal_protection:
  enabled: true
  temp_limit_c: 90
  rest_duration: "10m"
  check_every: 30

# -----------------------------------------------------------------------------
# Resume Settings
# -----------------------------------------------------------------------------
# [Pass 15]: Enabled — resuming from step 2000 checkpoint.
# -----------------------------------------------------------------------------
resume:
  enabled: true                         # [Pass 15 fix]: Model at step 2000 is learning
                                        # (loss 1.435, below random ~1.95). Continue
                                        # training rather than restarting from scratch.
  checkpoint_path: "models/checkpoints/model_step_002000.pt"
  skip_corrupted: true

# -----------------------------------------------------------------------------
# Time-based Stopping
# -----------------------------------------------------------------------------
time_limit:
  enabled: true
  duration: "6h"
