# =============================================================================
# Local Retrain Configuration (RTX 5050, 8GB VRAM, 12 cores, 32GB RAM)
# =============================================================================
# Updated 2026-04-05 — Pass 56 training analysis.
#
# Status: model at step 2000 with loss=1.43, 0% WR vs easy/medium.
# All bugs fixed (GradScaler, BatchNorm NaN repair, score clamp).
#
# IMPORTANT: Purge data/replay/ before starting — old replay data (56.9GB)
# was generated by a degenerate model (score clamp bug, NaN-corrupted weights)
# and has extreme P1 bias (99.7% P1 wins). Fresh self-play is required.
#
# Pass 56 changes:
#   - algo_vs_algo reduced 900→200 (P1-biased data was 82% of buffer)
#   - algo_vs_algo difficulties: removed "hard" (beyond model's capacity)
#   - games_per_epoch increased 200→300 (more ML-vs-algo training signal)
#   - reward_mode changed "cycle"→"scoring" (consistent signal, no cycling)
#   - replay_max_entries increased 400K→600K (more batches per epoch)
#   - Fixed stale comments (replay_max, clear_replay, ram_cache)
#
# Cumulative fixes (passes 20-55):
#   1. GradScaler save/restore fixed — old checkpoints get scale=1024.
#   2. BatchNorm NaN repair — corrupted running stats auto-reset.
#   3. torch.compile disabled — always fails on RTX 5050.
#   4. LR scheduler disabled — caused catastrophic 43%→0% WR crash.
#   5. LR fixed at 1.5e-4 — conservative fine-tuning rate.
#   6. gradient_accumulation_steps=1 — avoids NaN interaction.
#   7. Testing vs easy — 0% WR vs medium gives no signal.
#
# Board encoding correctly flips for P2 (move_encoder.py:30-35).
# P1/P2 win rates are both 0% — the model is simply undertrained.
#
# Usage:
#   rm -rf data/replay/*.jsonl   # Purge stale replay data first
#   bash local_train.sh
# =============================================================================

# -----------------------------------------------------------------------------
# Device Settings
# -----------------------------------------------------------------------------
device:
  type: "cuda"
  amp:
    enabled: true
    dtype: "float16"                    # float16 + GradScaler for RTX 5050
  compile:
    enabled: false                      # [Pass 20] Always fails on RTX 5050 with
                                        # "CUDA driver error: device kernel image is invalid".
                                        # Disabling avoids 5s warmup overhead each run.
  matmul_precision: "medium"            # TF32 enabled

# -----------------------------------------------------------------------------
# Model Architecture
# -----------------------------------------------------------------------------
# Must match checkpoint at models/checkpoints/model_step_002000.pt.
# DO NOT change without retraining from scratch.
# -----------------------------------------------------------------------------
model:
  channels: 128                         # CNN channels in ResidualBlocks
  num_blocks: 8                         # Number of residual blocks
  embedding_size: 256                   # Board embedding vector size
  hidden_size: 128                      # MoveScorer MLP hidden layer size

# -----------------------------------------------------------------------------
# Self-Play Settings
# -----------------------------------------------------------------------------
# At 0% WR, 100% algorithmic teachers. ML self-play at this stage produces
# losing patterns. algo_vs_algo provides high-quality baseline data.
# -----------------------------------------------------------------------------
selfplay:
  cpu_workers: 11                       # 11 of 12 cores — 1 for GPU thread + system
                                        # (torch.set_num_threads(1) in GPU mode)
  games_per_epoch: 300                  # [Pass 56] Increased from 200. More ML-vs-algo data.
                                        # 300 games x ~40 moves = ~12K entries/cycle.
                                        # With algo_vs_algo=200, total ~20K entries/cycle.
                                        # 150 as P1 + 150 as P2 (focus_side: "both").
  difficulties:
    - "easy"                            # Learnable signal for a weak model.
    - "medium"                          # Adds challenge without being impossibly hard.
  focus_side: "both"                    # Equal P1/P2 exposure. Board encoding flips
                                        # for P2 (move_encoder.py:30-35) — both sides
                                        # need equal training for the model to generalize.
  opponent_focus: "algorithm"           # 100% algorithmic teachers at 0% WR.
  noise_prob: 0.15                      # [Pass 20] Reduced from 0.18. Model has 2K steps
                                        # of learning — slightly less exploration appropriate.
  max_moves_per_game: 150               # Allow endgame play (avg game ~42 moves)
  pipeline_mode: "simultaneous"         # GPU trains on existing data while CPU generates.
  max_stale_epochs: 0                   # [Pass 47] Explicit (was relying on trainer default).
                                        # 0 = unlimited GPU training while CPU generates.
                                        # Thermal protection handles GPU temperature.

  algo_vs_algo:
    enabled: true
    games_per_epoch: 200                # [Pass 56] Reduced from 900. Algo-vs-algo had 99.7%
                                        # P1 win rate, creating extreme bias in training data.
                                        # 200 algo + 300 ML = 40% algo (was 82%). ML-vs-algo
                                        # with focus_side: "both" provides balanced P1/P2 signal.
                                        # ~8K algo entries + ~12K ML entries = ~20K/cycle.
    difficulties:
      - "easy"                          # [Pass 56] Removed "hard" — model at 0% WR cannot
      - "medium"                        # learn from hard demonstrations. Keeps matchups simpler.

# -----------------------------------------------------------------------------
# Training Hyperparameters
# -----------------------------------------------------------------------------
training:
  batch_size: 8192                      # Doubled from 4096. At 8192: ~1.2GB activations —
                                        # only 15% of 8GB VRAM. Better GPU warp occupancy.
                                        # At 600K entries: ~73 batches/epoch (was ~146).
                                        # Still plenty of gradient updates per data pass.
  learning_rate: 2.0e-4                 # Sqrt-scaled from 1.5e-4 for 2x batch:
                                        #   lr_new = 1.5e-4 × sqrt(2) ≈ 2.12e-4, rounded to 2.0e-4.
                                        # Conservative — well below 3.9e-4 crash threshold.
  weight_decay: 1.0e-5                  # [Pass 20] Reduced from 1e-4. Original clamp bug
                                        # is fixed — lower regularization lets the model
                                        # learn more freely.
  grad_clip_norm: 1.0                   # Standard gradient clipping
  train_steps: 100000000000             # Unlimited — time_limit controls stopping
  checkpoint_every: 1000                # Frequent saves for tracking progress
  gradient_accumulation_steps: 1        # [Pass 20] Reduced from 2. Simpler — avoids
                                        # edge cases where NaN batches interact with
                                        # accumulation window.

  # LR SCHEDULER: DISABLED
  # [Pass 20] Consistent with training_config_local.yaml. Cosine warm restarts
  # caused catastrophic regression in prior runs (43%→0% WR crash, pass 18).
  # Fixed LR is stable. Re-enable only after the model reaches a clear plateau
  # (loss stable for >5000 steps AND WR stable for >3 test cycles).
  lr_scheduler:
    enabled: false
    type: "cosine_warm_restarts"        # (Inactive — kept for reference)
    T_0: 5000
    T_mult: 2
    eta_min: 5.0e-5
    warmup_steps: 200

  reward_mode: "scoring"                # [Pass 56] Changed from "cycle". Consistent reward
                                        # signal. "cycle" alternated scoring/uniform epochs,
                                        # which amplified P1 bias on scoring epochs (high weight
                                        # for P1 winning moves, low for P2 losing moves).
                                        # Constant "scoring" provides stable, consistent signal.

# -----------------------------------------------------------------------------
# Value Head / TD Learning Settings
# -----------------------------------------------------------------------------
# DISABLED: Current checkpoint (model_step_002000.pt) has value_head_enabled=False.
# Enabling this would add randomly-initialized value head parameters that the
# optimizer hasn't seen — momentum/variance buffers would be absent, causing
# training instability for the new parameters.
# Enable only when retraining from scratch or when the server checkpoint
# includes a trained value head.
# -----------------------------------------------------------------------------
value_head:
  enabled: false
  hidden_size: 128                        # Match server config for future compatibility
  value_weight: 0.15                      # 85% policy / 15% value if enabled

# -----------------------------------------------------------------------------
# DataLoader Settings
# -----------------------------------------------------------------------------
dataloader:
  num_workers: 0                        # FastBatchIterator bypasses DataLoader
  pin_memory: true
  replay_max_entries: 600000            # [Pass 56] Increased from 400K. 600K x ~1.2KB (32 move
                                        # slots, fp16 on GPU) = ~0.7GB VRAM. Fits easily in 8GB.
                                        # At batch_size=4096, gives ~146 batches/epoch (was ~97).
  max_moves_per_sample: 32              # Max legal moves in Dama is ~20; saves 50% memory
  clear_replay_after_load: true         # [Pass 56] Clear replay files after loading into buffer.
                                        # Prevents disk from filling with stale data. Buffer holds
                                        # the most recent entries up to replay_max_entries.

  ram_cache:
    enabled: true
    threshold_gb: 8.0                  # 8GB cache limit on 32GB system — leaves 24GB for
                                        # OS, self-play workers, and GPU driver overhead.
    cache_file: null

# -----------------------------------------------------------------------------
# Model Testing Settings (ML vs Algorithm)
# -----------------------------------------------------------------------------
# Test vs easy to detect early progress. Switch to medium once >50% WR vs easy.
# -----------------------------------------------------------------------------
testing:
  enabled: true
  every_n_steps: 750                    # [Pass 34] Faster feedback during early learning phase
  num_games: 50                         # [Pass 34] ±14% CI (was 30/±18%). More reliable signal.
  difficulty: "easy"                    # Start easy — 0% vs medium gives no signal

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
paths:
  checkpoint_dir: "models/checkpoints"
  latest_model: "models/latest.pt"
  replay_dir: "data/replay"
  log_dir: "logs"
  stats_file: "models/training_stats.json"

# -----------------------------------------------------------------------------
# Statistics Collection
# -----------------------------------------------------------------------------
statistics:
  enabled: true
  record_every: 200                     # Balance between GPU sync stalls and monitoring
  system_every: 5000
  model_health_every: 1000              # Monitor embedding magnitudes closely
  score_dist_every: 500
  buffer_size: 50000
  flush_every: 500                      # Ensures stats are written frequently
  output_dir: "logs/stats"

# -----------------------------------------------------------------------------
# Thermal Protection
# -----------------------------------------------------------------------------
thermal_protection:
  enabled: true
  temp_limit_c: 90
  rest_duration: "5m"                    # [Pass 34] 10m was overly conservative; 5m is standard
  check_every: 30

# -----------------------------------------------------------------------------
# Resume Settings
# -----------------------------------------------------------------------------
# GradScaler save/restore bug fixed in trainer.py (pass 20). Old checkpoints
# without scaler state now get conservative scale=1024 automatically.
# -----------------------------------------------------------------------------
resume:
  enabled: true
  checkpoint_path: null                  # Auto-detect latest valid checkpoint.
                                        # Was hardcoded to model_step_002000.pt — caused
                                        # restart-from-step-2000 trap on subsequent runs.
  skip_corrupted: true

# -----------------------------------------------------------------------------
# Time-based Stopping
# -----------------------------------------------------------------------------
time_limit:
  enabled: true
  duration: "6h"
