# =============================================================================
# Local Retrain Configuration (RTX 5050, 8GB VRAM, 12 threads, 32GB RAM)
# =============================================================================
# Fresh training from random weights. The full pass-by-pass history, rationale,
# and measurements live in config/Journal.md; this file keeps only one-line
# pointers ("See Journal Pass N"). The 100-pass 0% WR blocker was an ARCH bug
# (unnormalized board embedding swamped move features); fixed in model.py via
# embed_norm. See Journal Pass 102. Board encoding flips for P2 (move_encoder.py:30-35).
#
# Usage: bash local_train.sh
# =============================================================================

# -----------------------------------------------------------------------------
# Device Settings
# -----------------------------------------------------------------------------
device:
  type: "cuda"
  amp:
    enabled: true
    dtype: "bfloat16"                   # Blackwell CC 12.0: no GradScaler, fused AdamW. See Journal Pass 74.
  compile:
    enabled: false                      # Always fails on RTX 5050 (inductor/Triton sm_120 codegen). See Journal Pass 20, 92.
  matmul_precision: "medium"            # TF32 enabled

# -----------------------------------------------------------------------------
# Model Architecture (128/8/256/128 - must match any resumed checkpoint)
# -----------------------------------------------------------------------------
model:
  channels: 128                         # CNN channels in ResidualBlocks
  num_blocks: 8                         # Number of residual blocks
  embedding_size: 256                   # Board embedding vector size
  hidden_size: 128                      # MoveScorer MLP hidden layer size

# -----------------------------------------------------------------------------
# Self-Play Settings
# -----------------------------------------------------------------------------
# 100% algorithmic teachers at 0% WR (ML self-play teaches losing patterns).
# ML-vs-algo gives balanced P1/P2 teacher signal. See Journal "Reference".
# -----------------------------------------------------------------------------
selfplay:
  cpu_workers: 6                        # 8->6; GPU is power/thermal-capped, self-play-heat thesis refuted. See Journal Pass 85-89.
  games_per_epoch: 500*4                # =2000 (eval'd by _eval_expr); compensates algo_vs_algo removal. See Journal Pass 86.
  difficulties:
    - "easy"                            # Learnable signal for a weak model.
    - "medium"                          # Adds challenge without being impossibly hard.
    - "hard"
  focus_side: "both"                    # Equal P1/P2 exposure (encoding flips for P2). See Journal Pass 38.
  opponent_focus: "algorithm"           # 100% algorithmic teachers at low WR.
  noise_prob: 0.20                      # Fresh-model exploration. See Journal Pass 83.
  max_moves_per_game: 150               # Allow endgame play (avg game ~42 moves).
  pipeline_mode: "simultaneous"         # CPU self-play overlaps GPU training. See Journal Pass 63.
  max_stale_epochs: 100                 # Limits overfitting while buffer is small. See Journal Pass 83.

  # ALGO-VS-ALGO: DISABLED - 99.7% P1 bias; re-enable only above >30% WR. See Journal Pass 83 + Landmines.
  algo_vs_algo:
    enabled: false
    games_per_epoch: 1000*2             # (Inactive - kept for re-enable reference)
    difficulties:
      #- "easy"
      #- "medium"
      - "hard"

# -----------------------------------------------------------------------------
# Training Hyperparameters
# -----------------------------------------------------------------------------
training:
  batch_size: 8192                      # Max for 8GB VRAM; 16384 -> sysmem fallback. See Journal Pass 85 + Landmines.
  learning_rate: 2.0e-4                 # Correct base LR for batch 8192. See Journal Pass 82.
  weight_decay: 1.0e-5                  # Lower regularization after clamp-bug fix. See Journal Pass 20.
  grad_clip_norm: 1.0                   # Standard gradient clipping
  train_steps: 100000000000             # Unlimited - time_limit controls stopping
  checkpoint_every: 1000                # Frequent saves for tracking progress
  gradient_accumulation_steps: 1        # See Journal Pass 20.

  # LR SCHEDULER: DISABLED - cosine restarts caused 43%->0% WR crash (LOCAL landmine). See Journal Pass 18, 20.
  lr_scheduler:
    enabled: false
    type: "cosine_warm_restarts"        # (Inactive - kept for reference)
    T_0: 5000
    T_mult: 2
    eta_min: 5.0e-5
    warmup_steps: 200

  reward_mode: "scoring"                # Consistent signal; 'cycle' amplifies P1 bias. See Journal Pass 56.

# -----------------------------------------------------------------------------
# Value Head / TD Learning Settings
# -----------------------------------------------------------------------------
value_head:
  enabled: false                        # Off until policy head reaches >30% WR. See Journal Pass 61.
  hidden_size: 128                      # Match server config for future compatibility
  value_weight: 0.15                    # 85% policy / 15% value if enabled

# -----------------------------------------------------------------------------
# DataLoader Settings
# -----------------------------------------------------------------------------
dataloader:
  num_workers: 0                        # FastBatchIterator bypasses DataLoader
  pin_memory: true
  replay_max_entries: 500000            # ~30 cycles of data (~585MB). See Journal Pass 83.
  max_moves_per_sample: 32              # Max legal moves in Dama is ~20; saves 50% memory
  clear_replay_after_load: true         # Prevent stale-data accumulation on disk. See Journal Pass 56.

  ram_cache:
    enabled: true
    threshold_gb: 16.0                  # 16GB cache on 32GB system (~25GB usable under WSL2)
    cache_file: "data/replay_cache/local_retrain_cache.pt"  # Persist RAM cache artifact for warm starts. See Journal Pass 108.

# -----------------------------------------------------------------------------
# Model Testing Settings (ML vs Algorithm)
# -----------------------------------------------------------------------------
testing:
  enabled: true
  every_n_steps: 750                    # Faster feedback during early learning. See Journal Pass 34.
  num_games: 50                         # +/-14% CI (was 30/+/-18%). See Journal Pass 34.
  difficulty: "easy"                    # Start easy - 0% vs medium gives no signal

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
paths:
  checkpoint_dir: "models/checkpoints"
  latest_model: "models/latest.pt"
  replay_dir: "data/replay"
  log_dir: "logs/local"
  stats_file: "models/training_stats_local.json"

# -----------------------------------------------------------------------------
# Statistics Collection
# -----------------------------------------------------------------------------
statistics:
  enabled: true
  record_every: 200                     # Capture grad norms (off-by-one fixed in Pass 82). See Journal Pass 83.
  system_every: 5000
  model_health_every: 5000              # 1000 was excessive (~40 .item() syncs). See Journal Pass 17.
  score_dist_every: 500
  buffer_size: 50000
  flush_every: 500                      # Write stats frequently
  output_dir: "logs/local/stats"

# -----------------------------------------------------------------------------
# Thermal Protection
# -----------------------------------------------------------------------------
thermal_protection:
  enabled: true
  temp_limit_c: 90
  rest_duration: "30m"                   # See Journal Pass 34.
  check_every: 30

# -----------------------------------------------------------------------------
# Resume Settings
# -----------------------------------------------------------------------------
resume:
  enabled: true                        # FRESH START (mandatory): embed_norm arch fix obsoletes all old checkpoints. See Journal Pass 102.
  checkpoint_path: null                 # Auto-detect; never hardcode (restart-from-step trap). See Journal Pass 20 + Landmines.
  skip_corrupted: true

# -----------------------------------------------------------------------------
# Time-based Stopping
# -----------------------------------------------------------------------------
time_limit:
  enabled: true
  duration: "10h"
