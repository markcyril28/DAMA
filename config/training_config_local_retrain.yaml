# =============================================================================
# Local Retrain Configuration (RTX 5050, 8GB VRAM, 12 cores, 32GB RAM)
# =============================================================================
# Updated 2026-04-05 — Training Analysis Pass 83.
#
# Status: Fresh training from random weights. Prior run (step 3000, loss=1.70,
# 0% WR) diverged due to:
#   a) LR 2.8e-4 was too high (fixed to 2.0e-4 in pass 82)
#   b) algo_vs_algo (4000 hard games) created 95:5 data ratio with 99.7% P1
#      win bias — model learned biased P1 patterns instead of balanced play
#   c) GPU overfitted on stale buffer while waiting for slow CPU cycles
#
# Key changes this pass (analysis-driven):
#   1. algo_vs_algo DISABLED — 99.7% P1 bias in algo-vs-algo (hard)
#      overwhelmed the 5% ML-vs-algo data. Removing it forces all training
#      signal through balanced ML-vs-algo games (50% P1, 50% P2).
#   2. games_per_epoch 200 → 400 — compensates for lost algo data volume.
#      400 × 42 moves = ~16.8K entries/cycle (was ~8.4K ML + ~168K algo).
#   3. noise_prob 0.15 → 0.20 — fresh model needs broader exploration.
#   4. max_stale_epochs 0 → 100 — prevents extreme overfitting while the
#      buffer is small (early cycles have <50K entries).
#   5. record_every 1000 → 200 — capture grad norms now that off-by-one
#      bug is fixed (pass 82). Critical for diagnosing next divergence.
#
# Board encoding correctly flips for P2 (move_encoder.py:30-35).
#
# Usage:
#   bash local_train.sh
# =============================================================================

# -----------------------------------------------------------------------------
# Device Settings
# -----------------------------------------------------------------------------
device:
  type: "cuda"
  amp:
    enabled: true
    dtype: "bfloat16"                   # [Pass 74] bfloat16 on Blackwell (CC 12.0):
                                        # - No GradScaler needed (same exponent range as fp32)
                                        # - Enables fused AdamW (single kernel per step)
                                        # - Eliminates per-step CUDA sync from GradScaler NaN check
  compile:
    enabled: false                      # [Pass 20] Always fails on RTX 5050 with
                                        # "CUDA driver error: device kernel image is invalid".
                                        # Disabling avoids 5s warmup overhead each run.
  matmul_precision: "medium"            # TF32 enabled

# -----------------------------------------------------------------------------
# Model Architecture
# -----------------------------------------------------------------------------
# Architecture: 128/8/256/128. Must match any checkpoint being resumed.
# Starting fresh → no compatibility concern, but keep consistent across configs.
# -----------------------------------------------------------------------------
model:
  channels: 128                         # CNN channels in ResidualBlocks
  num_blocks: 8                         # Number of residual blocks
  embedding_size: 256                   # Board embedding vector size
  hidden_size: 128                      # MoveScorer MLP hidden layer size

# -----------------------------------------------------------------------------
# Self-Play Settings
# -----------------------------------------------------------------------------
# At 0% WR, 100% algorithmic teachers. ML self-play at this stage produces
# losing patterns. ML-vs-algo games provide balanced teacher signal from both
# P1 and P2 perspectives (algo wins as both sides).
# -----------------------------------------------------------------------------
selfplay:
  cpu_workers: 8                        # [Pass 85] Reduced from 10. Measured on 2026-06-12: 10 workers
                                        # push the shared laptop heatpipe to 87-89C, which activates
                                        # GPU "SW Thermal Slowdown" and pins the GPU at 277MHz of
                                        # 3090MHz max (29W of 75W limit), ~11x slower batches.
                                        # Self-play over-produces data 50-100x relative to GPU
                                        # consumption (104K entries/40s vs max_stale 100 epochs),
                                        # so trading 2 workers for GPU clock headroom is a large
                                        # net throughput win. Trainer thread + OS use the rest.
  games_per_epoch: 500*4                  # [Pass 83] Doubled from 200 to compensate for algo_vs_algo
                                        # removal. 400 × ~42 moves = ~16.8K entries/cycle.
                                        # 200 as P1 + 200 as P2 (focus_side: "both").
                                        # Algo teacher moves get high reward weights (~2.0),
                                        # providing imitation learning signal from both sides.
  difficulties:
    - "easy"                            # Learnable signal for a weak model.
    - "medium"                          # Adds challenge without being impossibly hard.
    - "hard"
  focus_side: "both"                    # Equal P1/P2 exposure. Board encoding flips
                                        # for P2 (move_encoder.py:30-35) ��� both sides
                                        # need equal training for the model to generalize.
  opponent_focus: "algorithm"           # 100% algorithmic teachers at 0% WR.
  noise_prob: 0.20                      # [Pass 83] Increased from 0.15. Fresh model needs
                                        # broader exploration of the move space. At 0% WR,
                                        # the model's own policy is near-random anyway —
                                        # higher noise doesn't degrade quality much but
                                        # discovers more diverse game states.
  max_moves_per_game: 150               # Allow endgame play (avg game ~42 moves)
  pipeline_mode: "simultaneous"         # [Pass 63] CPU self-play overlaps GPU training.
                                        # GPU trains continuously on accumulating buffer while
                                        # CPU generates fresh data. Buffer fills to 1M entries
                                        # = 122 batches/epoch at batch=8192.
  max_stale_epochs: 100                 # [Pass 83] Changed from 0 (unlimited). Prevents extreme
                                        # overfitting when buffer is small in early training.
                                        # With ~16.8K entries and batch=8192, each epoch ≈2
                                        # batches. 100 epochs = 200 steps of training, then
                                        # yields to wait for fresh data. As the buffer grows
                                        # (1M entries → 122 batches/epoch), the cap is rarely
                                        # hit. Thermal protection still active as secondary guard.

  # ALGO-VS-ALGO: DISABLED
  # [Pass 83] Re-disabled after analysis found 95:5 data ratio (168K algo vs 8.4K ML)
  # with 99.7% P1 win bias in hard-only games. This overwhelmed the balanced ML-vs-algo
  # signal and taught the model P1-biased patterns. Prior pass 20 disabled it for the
  # same reason; pass 73 re-enabled it prematurely. Keep disabled until model reaches
  # >30% WR, at which point the P1 bias in algo data is offset by the model's own
  # competitive play generating balanced wins.
  algo_vs_algo:
    enabled: false
    games_per_epoch: 1000*2                # (Inactive — kept for re-enable reference)
    difficulties:
      #- "easy"
      #- "medium"
      - "hard"

# -----------------------------------------------------------------------------
# Training Hyperparameters
# -----------------------------------------------------------------------------
training:
  batch_size: 8192                      # [Pass 85] Reverted from 8192*2 (16384). At batch 16384 the
                                        # activations overflow 8GB VRAM and the Windows driver pages
                                        # GPU memory over PCIe (sysmem fallback). Measured on 2026-06-12:
                                        # 7.6GB/8.1GB used, "100%" util at only 23W power draw, and
                                        # 23-27s per batch (6 steps in 163.6s). At 8192 everything fits
                                        # in VRAM and batches return to sub-second. LR 2.0e-4 is also
                                        # tuned for 8192 (passes 82-84).
  learning_rate: 2.0e-4                 # [Pass 82] Reverted from 2.8e-4 — batch_size is
                                        # 8192 (not 16384). 2.0e-4 is the correct base LR.
  weight_decay: 1.0e-5                  # [Pass 20] Reduced from 1e-4. Original clamp bug
                                        # is fixed — lower regularization lets the model
                                        # learn more freely.
  grad_clip_norm: 1.0                   # Standard gradient clipping
  train_steps: 100000000000             # Unlimited — time_limit controls stopping
  checkpoint_every: 1000                # Frequent saves for tracking progress
  gradient_accumulation_steps: 1        # [Pass 20] Reduced from 2. Simpler — avoids
                                        # edge cases where NaN batches interact with
                                        # accumulation window.

  # LR SCHEDULER: DISABLED
  # [Pass 20] Consistent with training_config_local.yaml. Cosine warm restarts
  # caused catastrophic regression in prior runs (43%→0% WR crash, pass 18).
  # Fixed LR is stable. Re-enable only after the model reaches a clear plateau
  # (loss stable for >5000 steps AND WR stable for >3 test cycles).
  lr_scheduler:
    enabled: false
    type: "cosine_warm_restarts"        # (Inactive — kept for reference)
    T_0: 5000
    T_mult: 2
    eta_min: 5.0e-5
    warmup_steps: 200

  reward_mode: "scoring"                # [Pass 56] Changed from "cycle". Consistent reward
                                        # signal. "cycle" alternated scoring/uniform epochs,
                                        # which amplified P1 bias on scoring epochs (high weight
                                        # for P1 winning moves, low for P2 losing moves).
                                        # Constant "scoring" provides stable, consistent signal.

# -----------------------------------------------------------------------------
# Value Head / TD Learning Settings
# -----------------------------------------------------------------------------
# DISABLED: Starting fresh with no checkpoint. Value head adds complexity that
# isn't needed until the base policy head is working (>30% WR).
# Enable when the model has a solid policy baseline and you want position
# evaluation capabilities.
# -----------------------------------------------------------------------------
value_head:
  enabled: false                          # [Pass 61] Keep disabled until policy head reaches
                                          # >30% WR. Adding value head to weak model adds noise.
  hidden_size: 128                        # Match server config for future compatibility
  value_weight: 0.15                      # 85% policy / 15% value if enabled

# -----------------------------------------------------------------------------
# DataLoader Settings
# -----------------------------------------------------------------------------
dataloader:
  num_workers: 0                        # FastBatchIterator bypasses DataLoader
  pin_memory: true
  replay_max_entries: 500000              # [Pass 83] Reduced from 1M. With algo_vs_algo disabled,
                                        # each cycle adds ~16.8K entries. 500K ≈ 30 cycles of data.
                                        # 500K × 1168 bytes = ~585MB VRAM. With model (72MB),
                                        # activations (~1.2GB at batch=8192), total ~1.9GB of 8GB.
                                        # 500K / 8192 = 61 batches/epoch.
  max_moves_per_sample: 32              # Max legal moves in Dama is ~20; saves 50% memory
  clear_replay_after_load: true          # [Pass 56] Clear replay files after loading into buffer.
                                        # Prevents disk from filling with stale data. Buffer holds
                                        # the most recent entries up to replay_max_entries.

  ram_cache:
    enabled: true
    threshold_gb: 16.0                  # 8GB cache limit on 32GB system — leaves 24GB for
                                        # OS, self-play workers, and GPU driver overhead.
    cache_file: null

# -----------------------------------------------------------------------------
# Model Testing Settings (ML vs Algorithm)
# -----------------------------------------------------------------------------
# Test vs easy to detect early progress. Switch to medium once >50% WR vs easy.
# -----------------------------------------------------------------------------
testing:
  enabled: true
  every_n_steps: 750                    # [Pass 34] Faster feedback during early learning phase
  num_games: 50                         # [Pass 34] ±14% CI (was 30/±18%). More reliable signal.
  difficulty: "easy"                    # Start easy — 0% vs medium gives no signal

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
paths:
  checkpoint_dir: "models/checkpoints"
  latest_model: "models/latest.pt"
  replay_dir: "data/replay"
  log_dir: "logs/local"
  stats_file: "models/training_stats_local.json"

# -----------------------------------------------------------------------------
# Statistics Collection
# -----------------------------------------------------------------------------
statistics:
  enabled: true
  record_every: 200                      # [Pass 83] Reduced from 1000. Grad norm off-by-one bug
                                        # was fixed in pass 82 — norms are now actually recorded.
                                        # Need fine-grained data to diagnose next divergence.
                                        # 200 still only adds 5 CUDA syncs/1000 steps (~250µs).
  system_every: 5000
  model_health_every: 5000              # 1000 was excessive — each records ~40 .item() syncs.
                                        # 5000 matches local config.
  score_dist_every: 500
  buffer_size: 50000
  flush_every: 500                      # Ensures stats are written frequently
  output_dir: "logs/local/stats"

# -----------------------------------------------------------------------------
# Thermal Protection
# -----------------------------------------------------------------------------
thermal_protection:
  enabled: true
  temp_limit_c: 90
  rest_duration: "5m"                    # [Pass 34] 10m was overly conservative; 5m is standard
  check_every: 30

# -----------------------------------------------------------------------------
# Resume Settings
# -----------------------------------------------------------------------------
# GradScaler save/restore bug fixed in trainer.py (pass 20). Old checkpoints
# without scaler state now get conservative scale=1024 automatically.
# -----------------------------------------------------------------------------
resume:
  enabled: true
  checkpoint_path: null                  # Auto-detect latest valid checkpoint.
                                        # Was hardcoded to model_step_002000.pt — caused
                                        # restart-from-step-2000 trap on subsequent runs.
  skip_corrupted: true

# -----------------------------------------------------------------------------
# Time-based Stopping
# -----------------------------------------------------------------------------
time_limit:
  enabled: true
  duration: "6h"
